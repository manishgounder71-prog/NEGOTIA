services:
  - type: web
    name: negotia-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./negotia.db
      - key: DATABASE_SYNC_URL
        value: sqlite:///./negotia.db
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATION_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
